# ============================================================
# @description time-traveler-handbook nginx 配置（纯静态托管）
# 与 scx-terminal 同模式：ECS --network host 部署，监听 1046
# ============================================================

server {
    listen 1046;
    server_name _;

    # 静态站点根目录（Astro 构建产物 dist/）
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;
    gzip_min_length 1024;

    # 纯静态多页站点（Starlight 每页均有实体 HTML），404 直接返回，不做 SPA fallback
    location / {
        try_files $uri $uri/ =404;
    }

    # Astro 哈希资源（/_astro/xxx.[hash].js|css|woff2），内容寻址，可放心长缓存
    # ^~ 前缀匹配优先于下方正则，保证哈希资源命中 immutable
    location ^~ /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 入口禁长缓存（配合 etag），保证部署后更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 字体与图片较长缓存（基本不变更）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
